name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-15-intel
            name: macOS
          - os: windows-latest
            name: Windows

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAH_ENABLE_TESTS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNAH_ENABLE_TESTS=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: nah-${{ matrix.name }}
          path: |
            build/tools/nah/nah
            build/tools/nah/nah.exe
            build/tools/nah/Release/nah.exe
          if-no-files-found: ignore

  conan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-15-intel
            name: macOS

    name: Conan (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect

      - name: Create and test package
        run: conan create . --build=missing -o '&:build_tools=False'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check formatting
        run: |
          ! grep -rn '[[:blank:]]$' --include='*.cpp' --include='*.hpp' --include='*.h' include/ tools/ tests/
          ! grep -rn $'\t' --include='*.cpp' --include='*.hpp' --include='*.h' include/ tools/ tests/
