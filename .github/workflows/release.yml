name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-x64
            msvc_arch: x64
          - os: windows-11-arm
            platform: windows-arm64
            msvc_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSVC must be set up for Windows builds
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAH_ENABLE_TESTS=OFF \
            -DNAH_ENABLE_TOOLS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DNAH_ENABLE_TESTS=OFF `
            -DNAH_ENABLE_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          cd build/tools/nah
          tar -czf ../../../nah-${{ matrix.platform }}.tar.gz nah
          cd ../../../
          ls -la nah-*.tar.gz

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build/tools/nah/nah.exe"
          if (Test-Path $exe) {
            Compress-Archive -Path $exe -DestinationPath nah-${{ matrix.platform }}.zip
          } else {
            Write-Error "nah.exe not found at $exe"
            exit 1
          }
          Get-ChildItem nah-*.zip

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nah-${{ matrix.platform }}
          path: nah-${{ matrix.platform }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nah-${{ matrix.platform }}
          path: nah-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/nah-*.tar.gz
            artifacts/*/nah-*.zip
            SHA256SUMS
          generate_release_notes: true
